# Blinds Dashboard
# Lovelace dashboard for window blinds and shutter control

title: Blinds
views:
  - title: Blinds
    path: blinds
    icon: mdi:window-shutter
    cards:
      - type: vertical-stack
        title: Kids Bedroom
        cards:
          - type: custom:mushroom-cover-card
            entity: cover.smart_roller_shutter_2403076692918970200148e1e9eecc6d_shutter
            name: Kids Bedroom
            icon: mdi:blinds
            show_buttons_control: true
            show_position_control: true
            layout: horizontal
            fill_container: true
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Open
                secondary: 100%
                icon: mdi:arrow-up-box
                icon_color: green
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: cover.set_cover_position
                  target:
                    entity_id: cover.smart_roller_shutter_2403076692918970200148e1e9eecc6d_shutter
                  data:
                    position: 100
              - type: custom:mushroom-template-card
                primary: Partial
                secondary: 60%
                icon: mdi:arrow-collapse-down
                icon_color: amber
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: cover.set_cover_position
                  target:
                    entity_id: cover.smart_roller_shutter_2403076692918970200148e1e9eecc6d_shutter
                  data:
                    position: 60
              - type: custom:mushroom-template-card
                primary: Close
                secondary: 0%
                icon: mdi:arrow-down-box
                icon_color: red
                layout: vertical
                fill_container: true
                tap_action:
                  action: perform-action
                  perform_action: cover.set_cover_position
                  target:
                    entity_id: cover.smart_roller_shutter_2403076692918970200148e1e9eecc6d_shutter
                  data:
                    position: 0

      - type: vertical-stack
        title: Garden Shade
        cards:
          - type: custom:mushroom-cover-card
            entity: cover.smart_roller_shutter_24121047557727700802c4e7ae116985_shutter
            name: Garden Shade
            icon: mdi:roller-shade
            show_buttons_control: true
            show_position_control: true
            layout: horizontal
            fill_container: true
